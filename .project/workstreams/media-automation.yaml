schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "migration-acceptance-closure"

current_gate: >
  Complete one fresh real Sonarr/Radarr torrent import through the corrected
  shared /data path and verify matching inode numbers with link count >=2.
  If that passes, the media workstream can hand migration acceptance back to
  infrastructure for formal closure.

current_state: >
  The desktop media stack is functioning end to end. The final torrent
  acceptance test initially exposed duplicate-copy behavior: The Fall of the
  House of Usher S01E01 had different inode numbers and links=1 between the
  torrent and TV-library files. Sonarr's hardlink option was confirmed enabled,
  while Docker inspection showed split /downloads and /tv bind mounts. The
  Compose layout has now been corrected in this workstream by adding a shared
  /data:/data bind mount to both Sonarr and Radarr, recreating both containers
  successfully under the migration override, and adding Remote Path Mappings
  for qBittorrent from /downloads to /data/torrents. A direct hardlink test
  inside the Sonarr container succeeded between /data/torrents and
  /data/media/tv: both test paths reported inode 256114799 and links=2. This
  verifies that the corrected container/filesystem topology is hardlink-capable.
  It does not yet prove that ARR uses the corrected path during a real import,
  so one fresh live torrent import remains before acceptance can close. The
  next media-app priority after closure is Bazarr/subtitle automation. English
  subtitles remain the primary/default preference; Bazarr should avoid
  duplicating good embedded/present English subtitles while additionally
  finding high-quality Czech subtitles matched closely to the exact release so
  they are available as an optional alternate track in Plex. The goal is to
  reduce manual Czech subtitle searching/pairing, not to replace English.
  After that come the Plex-visible persistent watched-library concept, Trakt/
  PlexTraktSync, Seerr, Kometa v2 refinement, controlled remote access and
  media agents. SAB-vs-Plex disk-I/O contention remains a later performance
  optimization, likely using dedicated SSD scratch storage.

exact_next_action: >
  When server access is available again, grab one fresh, preferably small
  torrent through Sonarr or Radarr and let ARR import it normally while
  qBittorrent keeps seeding. Then compare one source file under /data/torrents
  with its imported library file using stat. Migration acceptance passes only
  if both paths have the same inode and link count >=2.

blockers:
  - >
    Filesystem/container hardlink capability is fixed and verified, but the
    corrected ARR workflow still needs one fresh end-to-end torrent import test.

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure, Migration & GitHub"
    dependency: >
      No action is currently required for the ARR hardlink fix. After the fresh
      real import test passes, infrastructure should refresh its state and
      perform formal migration closure, rollback-disk disposition, permanent
      image pin/update policy and backup hardening.

important_open_loops:
  - "Run one fresh real torrent import through Sonarr or Radarr after the shared /data and Remote Path Mapping correction."
  - "Verify matching inode/link count on the fresh torrent-side and library-side files while qBittorrent is still seeding."
  - "The pre-fix House of Usher torrent/library files are separate copies; clean duplicate torrent payloads only after deciding whether seeding is still needed."
  - "After acceptance, tell infrastructure the ARR hardlink mount/path defect is resolved and hand back formal migration closure."
  - "Deploy Bazarr next with English as the primary/default subtitle preference, avoid unnecessary duplicate English subtitles, and additionally fetch high-quality Czech subtitles matched closely to the exact release as an optional alternate track."
  - "Tune subtitle provider/language/scoring rules separately for movies and TV so Czech subtitles are reliable without replacing English or creating clutter."
  - "Design a persistent Plex-visible watched-library/personal-cinema shelf so watched titles remain visually browsable after local media deletion."
  - "Test native Plex/List-style implementation first; evaluate a dedicated archive/placeholder library only if the TV-client experience is inadequate."
  - "Connect persistent watched history later to Trakt/PlexTraktSync and the planned media/ČSFD database so local availability is separate from viewing history."
  - "Add Seerr after subtitle/history foundations are stable."
  - "Iterate Kometa v2 based on the actual TV experience rather than a fixed row plan."
  - "Keep nzb360 premium unlock/subscription deferred for now."
  - "Add controlled remote access before enabling remote media-agent operations."
  - "Later media agents remain Observer, Curator and Media Operator, with destructive actions confirmation-gated."
  - "After acceptance, decide with infrastructure whether to unmount, archive, repurpose, or wipe the old rollback disk."
  - "Replace the temporary migration-version override with the permanent image pin/update policy."
  - "Harden backup/restore procedures, retention, and restore drills."
  - "Treat SAB scratch separation as a future performance optimization, likely on SSD; exact device/layout is not yet decided."

stale_or_unknown:
  - "A fresh end-to-end ARR import has not yet verified that Remote Path Mapping is applied exactly as intended during real torrent import."
  - "The exact Plex implementation for the persistent watched-library shelf is undecided and should be validated on the actual TV client before committing to an architecture."
  - "Exact future SAB scratch device, size and filesystem are undecided; SSD is currently the likely direction."
  - "The old rollback disk is confirmed still attached read-only, but its final disposition is intentionally undecided until migration closure."

portfolio:
  milestone: true
  signal: >
    A subtle migration defect was diagnosed and corrected with evidence: split
    Docker bind mounts caused functional ARR imports to duplicate payloads
    rather than hardlink them. Sonarr/Radarr now share /data, qBittorrent paths
    are remapped consistently, and an in-container inode test proves the fixed
    topology can create real cross-directory ext4 hardlinks. The post-closure
    roadmap now extends from basic media automation toward a personal media
    knowledge layer: subtitle automation with English-first plus reliable Czech
    alternates, durable watched-history presentation, Trakt/ČSFD enrichment and
    later curated agents.

verification:
  last_verified: "2026-09-17"
  sources:
    - "Verified project-chat inode check for The Fall of the House of Usher S01E01 on 2026-09-13 showing pre-fix duplicate copies."
    - "Verified Docker inspection on 2026-09-13 showing the original split /downloads and /tv mounts."
    - "Verified Sonarr UI on 2026-09-13 showing Use Hardlinks instead of Copy enabled."
    - "Verified Compose validation and successful Sonarr/Radarr recreation after adding shared /data:/data on 2026-09-13."
    - "Verified Sonarr and Radarr Remote Path Mapping for qBittorrent: /downloads -> /data/torrents on 2026-09-13."
    - "Verified in-container hardlink test on 2026-09-13: inode 256114799, links=2 for both test paths."
    - "Roadmap priorities clarified in project chat on 2026-09-17: Bazarr next with English primary and Czech high-quality release-matched alternates; persistent Plex watched shelf, then Trakt/PlexTraktSync, Seerr, Kometa refinement, remote access and media agents."

sync:
  status: "synced"
  storage: ".project/workstreams/media-automation.yaml"
