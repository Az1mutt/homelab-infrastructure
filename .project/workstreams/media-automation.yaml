  candidates based on retained unique linkage that failed title/year validation, four
  require targeted external identity research, and one (Backrooms) requires Plex
  event/title linkage investigation. No ambiguity-case writes were made.

current_state: >
  The exact 20 ambiguity titles are now known. Fifteen cases retain a unique linked
  identity candidate but failed metadata identity/year validation; these are expected
  to be resolvable deterministically with focused validation. Four cases lack a stable
  retained identity and require targeted external research: I Love You Phillip Morris,
  Válka policajtů, Helloween, and Attonitas. Backrooms already has TMDb 1083381 and
  IMDb tt26657236 but remains blocked on conflicting Plex history/metadata linkage.
  The 538 fully-accounted titles remain untouched.

