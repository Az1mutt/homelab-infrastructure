status: "active"
phase: "watched-history-full-fleet-inventory-ready"

current_gate: >
  Full-fleet watched-history inventory is now available from durable current state.
  media.db contains 558 watched movies. The inventory reports 205 as fully accounted
  for in the Trakt pipeline and 353 remaining. Of those 353, one is already
  identity-qualified and 352 still lack stable TMDb/IMDb identity. Ten titles are in
  the known ambiguity backlog and are excluded from production selection, leaving
  343 production-eligible remaining movies. The accepted recommendation is to process
  the next 100 production-eligible titles using the proven large-batch pipeline.

current_state: >
  The watched-history/My Cinema Trakt workflow is operating as a proven production
  pipeline across pilot, medium, 25-title, 50-title and 100-title cohorts. The latest
  accepted 100-title cohort completed with 96 identity-qualified titles verified in
  Trakt, zero duplicates and complete private rollback evidence; one mid-batch
  read-back anomaly was safely reconciled without retrying the POST. A narrow
  read-only inventory now reports 558 total watched movies, 205 fully accounted in
  the production pipeline and 353 remaining. One remaining title already has stable
  identity, 352 still need stable identity enrichment, and ten known ambiguity cases
  are excluded from production selection. This leaves 343 production-eligible titles.
  Plex historical-date automation remains unverified and separate from Trakt backfill.

exact_next_action: >
  Process the next 100 of the 343 production-eligible remaining watched movies using
  the exact accepted large-batch workflow. Reuse durable state and completed checkpoints;
  do not revisit accounted titles or known ambiguity cases. Perform deterministic
  high-confidence TMDb/IMDb enrichment, skip new ambiguous identities immediately,
  run narrow Trakt/Plex preflight, use minimal freshness checks, write exactly once,
  read back with correct Trakt internal-ID semantics, verify identity/date/exactly-one
  event and capture rollback evidence privately. Stop the write stream on an ambiguous
  POST and preserve a resumable checkpoint. Do not modify Plex.

blockers:
  - "A safe programmable Plex account-level historical watched-date write method remains unconfirmed; do not automate Plex historical backfill yet."

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db and stable identity enrichment. Production
      scaling should continue to prefer deterministic/high-confidence resolution and
      defer ambiguous identities to a separate pass.
  - component: "Trakt"
    dependency: >
      OAuth is established privately. Preserve existing history, use correct Trakt
      internal-ID semantics for item-specific reads, retain event-specific rollback
      evidence, and never repeat an ambiguous POST.

