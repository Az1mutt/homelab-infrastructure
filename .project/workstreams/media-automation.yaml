schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "watched-history-medium-batch-preflight-ready"

current_gate: >
  The stable identity gate for the first medium watched-history cohort is complete.
  Infrastructure & Agent Control Plane inspected 40 watched candidates and persisted
  trustworthy TMDb+IMDb identities for 35 using the existing external_ids model;
  five ambiguous/mismatched candidates were excluded. PR #18 is merged on main at
  cab43971f0d3df3d81cf5dd718dc733b6cf60b5d. The next gate is a read-only history
  preflight for those 35 verified candidates across Plex cloud and Trakt before any
  medium-batch write. Plex historical-date automation remains unverified and must not
  be used for bulk historical backfill.

current_state: >
  Seerr is accepted end-to-end through Plex. Bazarr broad automation and the fresh
  torrent hardlink check remain non-blocking follow-up. The watched-history/My
  Cinema design has passed both a single-item Trakt write acceptance and a bounded
  five-title mini-batch with zero duplicates and precise rollback evidence. The
  identity bottleneck for the first medium cohort is now resolved: 40 watched
  candidates were checked, 35 received both stable TMDb and IMDb IDs in the existing
  external_ids representation, and five were deliberately skipped rather than
  guessed. The skipped titles are Hra s vrahem, Chuckuv zivot and Posedlost because
  of conflicting years, plus Zhoubne zlo and Skrys because the ID linkage remained
  ambiguous. No schema change was required, zero identity collisions were introduced,
  and watched/rating/CSFD data remained unchanged. A safe DB checkpoint/backup and
  private evidence were retained. PR #18 documenting the verified identity gate is
  merged and main was verified at cab43971f0d3df3d81cf5dd718dc733b6cf60b5d.
  Trakt OAuth remains established privately. Existing accepted Trakt events are Smile
  2 plus the five-title mini-batch: Heretic, Tetris, The Fifth Element, Inside Out 2
  and The Batman. Plex and media.db were not modified by those history writes. The
  next operation is read-only: preflight all 35 newly identity-qualified candidates
  against Plex cloud and Trakt history, derive per-title date provenance, and exclude
  any unsafe or already-imported item before authorizing the medium write batch. A
  temporary encrypted local transfer artifact/key remains an explicit cleanup open
  loop because automatic permission checks refused deletion; it remains local with
  restricted permissions.

exact_next_action: >
  Run one read-only history preflight across all 35 identity-qualified watched movies.
  For each candidate, verify TMDb/IMDb identity from media.db, snapshot current Trakt
  history, snapshot Plex cloud watch history where available, and derive the proposed
  import date provenance without writing anything. Skip any title already present in
  Trakt history. Prefer a real Plex watch date when available; where multiple Plex
  dates exist, use the previously user-authorized earliest-date rule and record that
  provenance privately. Never use CSFD rating dates as viewing dates. Where no real
  watch date is known, propose the agreed release-date legacy_placeholder with a
  synthetic noon Europe/Bratislava exact time. Return the final safe write cohort,
  counts by provenance/skip reason, and any ambiguity. Do not modify Trakt, Plex or
  media.db during this preflight.

blockers:
  - "A safe programmable Plex account-level historical watched-date write method remains unconfirmed; do not automate Plex historical backfill yet."

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, stable identity enrichment, CSFD/SerialZone
      ingestion, agent tools and control-plane write wrappers. The first medium-cohort
      identity gate is now complete for 35 candidates; unresolved titles remain
      intentionally excluded rather than guessed.
  - component: "Trakt"
    dependency: >
      OAuth is established privately. Preserve existing history, skip already-present
      titles, use explicit stable IDs, and retain event-specific rollback evidence for
      staged writes. Trakt is portable/shareable cross-source history, not merely a
      Plex mirror.
  - component: "Plex watched/history"
    dependency: >
      Preserve genuine Plex cloud watch events. Existing cloud dates are preferred
      as real-date evidence when available. Where multiple Plex dates exist, the
      explicitly user-authorized earliest-date rule may be used and must be recorded
      in the private audit. Imported legacy items must not overwrite Plex history.

important_open_loops:
  - "Run the read-only Plex/Trakt history preflight for all 35 identity-qualified candidates and produce the final safe medium-batch cohort."
  - "After a clean preflight, execute one medium Trakt-only batch from the safe cohort with sequential writes, per-item read-back, rollback IDs and stop-on-anomaly behavior."
  - "Keep the five unresolved identity candidates excluded until independently resolved; never guess title/year or ID linkage."
  - "Preserve date provenance: Plex-confirmed, explicitly user-authorized earliest Plex date when multiple events exist, or release-date legacy_placeholder when no real date is known."
  - "Never infer viewing dates from CSFD rating dates."
  - "After medium-batch acceptance, perform full Trakt ingest only after another explicit review gate."
  - "Confirm a safe programmable Plex account-level watched-date write/read-back/rollback path before any automated Plex historical backfill; do not write Plex SQLite directly."
  - "Clean up the temporary local encrypted transfer artifact/key only through an explicitly authorized safe cleanup step; do not expose its contents or secrets."
  - "Run one fresh real Sonarr/Radarr torrent import and verify hardlink inode/link count while qBittorrent is still seeding."
  - "Finish the Plex English-default subtitle client check opportunistically; broad Bazarr automation remains paused."
  - "Tune Bazarr language/provider/scoring rules separately for movies and TV against real library items."
  - "Iterate Kometa v2 only after watched/history behavior is stable."
  - "Coordinate with the Agent Control Plane instead of re-owning Movie Intelligence or agent-wrapper implementation in this workstream."

stale_or_unknown:
  - "Programmatic Plex historical watched-date editing is unverified; UI support alone is not sufficient for batch automation."
  - "The five excluded identity candidates remain unresolved until a stronger independent mapping source is available."
  - "Live ARR roots/mapping drift remains unresolved; historical direct hardlink capability does not verify a fresh actual ARR import."
  - "English default subtitle client behavior without a remembered override remains pending and non-blocking."

portfolio:
  milestone: true
  signal: >
    The first medium-cohort identity gate is complete: 35 watched movies now have
    persisted TMDb+IMDb identities with zero collisions and preserved existing
    personal-state data. The history pipeline can move from identity work to one
    read-only 35-title account preflight, after which write-path risk rather than
    entity matching becomes the remaining Trakt scaling concern.

