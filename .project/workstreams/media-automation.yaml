schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "watched-history-single-item-write-accepted"

current_gate: >
  The first Trakt-only watched-history write is accepted. Smile 2 was written once,
  read back with the intended identity/date, and has an event-specific rollback ID.
  The next gate is to expand the bounded 3-5 title pilot one item at a time, testing
  both Plex-confirmed dates and explicitly synthetic legacy placeholders before any
  medium batch. Plex historical-date automation remains unverified. Medium/full
  backfill must still wait for stable TMDb/IMDb enrichment in media.db.

current_state: >
  Seerr is accepted end-to-end through Plex. Bazarr broad automation and the fresh
  torrent hardlink check remain non-blocking follow-up. The watched-history/My
  Cinema design has now passed its first live Trakt write acceptance. Existing Plex
  behavior remains sufficient for the visual shelf: watched unavailable titles are
  browsable with posters on TV. The intended model is media.db as internal canonical
  state, Plex Watch History as the private visual shelf, and Trakt as portable/shareable
  cross-source watch history. Read-only discovery previously found that all 556
  currently watched Movie Intelligence rows carry only CSFD IDs; TMDb/IMDb mappings
  for the pilot are temporary Seerr-verified proposals and are not yet persisted
  identities in media.db. Current media.db watched_at values originate from CSFD
  rating dates and must not be treated as proven viewing dates. Trakt OAuth is
  verified and its token is stored privately on the homelab with mode 0600. Plex
  cloud history confirms Smile 2 on 2026-08-04, Heretic on 2026-07-12 and Inglourious
  Basterds on 2026-09-01; The Fifth Element was not found. On 2026-10-05 exactly one
  Trakt history mutation was performed: Smile 2 (2024), TMDb 1100782, watched_at
  2026-08-04T10:00:00Z. Read-back preserved the intended 2026-08-04 date, returned
  exactly one event with no duplicates, and yielded a precise rollback event ID
  stored privately. The audit distinguishes the Plex-confirmed real watch date from
  the synthetic exact time. The other three pilot/control titles remained unchanged;
  Plex and media.db were not modified. No anomalies were observed. A temporary
  encrypted local transfer artifact/key remains as an explicit cleanup open loop
  because automatic permission checks refused deletion; it remains local with
  restricted permissions.

exact_next_action: >
  Expand the pilot by exactly one more Trakt-only write: Heretic (2024), TMDb
  1138194, using the Plex-confirmed real watch date 2026-07-12 and a synthetic
  noon Europe/Bratislava exact time recorded separately in the private audit.
  Preserve Plex and media.db, read back the new event, verify exactly one matching
  history entry, capture its rollback ID, confirm Smile 2 and the control remain
  unchanged, and stop. Do not yet write The Fifth Element; reserve it for the next
  step because it specifically tests the legacy_placeholder date path.

blockers:
  - "A safe programmable Plex account-level historical watched-date write method remains unconfirmed; this does not block the staged Trakt pilot."
  - "Stable TMDb/IMDb enrichment for the 556 watched CSFD-only rows is required before medium/full backfill."

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, stable identity enrichment, CSFD/SerialZone
      ingestion, agent tools and control-plane write wrappers. Before medium/full
      watched-history backfill, persist stable TMDb/IMDb identities for the 556
      watched CSFD-only rows rather than relying on title-only or temporary mappings.
  - component: "Trakt"
    dependency: >
      OAuth is established privately. Use explicit stable IDs, preserve existing
      history, and require event-specific read-back/rollback evidence for staged
      writes. Trakt is portable/shareable cross-source history, not merely a Plex
      mirror.
  - component: "Plex watched/history"
    dependency: >
      Preserve genuine Plex cloud watch events. Smile 2, Heretic and Inglourious
      Basterds already have cloud history and must not be overwritten during the
      Trakt pilot. Imported legacy items must later skip existing Plex history and
      use precise rollback semantics if programmable writes are introduced.

important_open_loops:
  - "Run exactly one Trakt-only write for Heretic using the Plex-confirmed date, read it back, capture precise rollback ID, and stop."
  - "After Heretic, test The Fifth Element separately as the first true legacy_placeholder date case because Plex cloud history has no matching event."
  - "Complete the remaining 3-5 pilot with explicit per-title date provenance; never infer viewing dates from CSFD rating dates."
  - "Persist stable TMDb/IMDb enrichment for all 556 watched CSFD-only rows before medium/full backfill."
  - "Run the watched-history rollout in stages: accepted single item, then 3-5 pilot, then ~25-50 batch, then full ingest only after acceptance."
  - "Confirm a safe programmable Plex account-level watched-date write/read-back/rollback path before any automated Plex historical backfill; do not write Plex SQLite directly."
  - "Clean up the temporary local encrypted transfer artifact/key only through an explicitly authorized safe cleanup step; do not expose its contents or secrets."
  - "Run one fresh real Sonarr/Radarr torrent import and verify hardlink inode/link count while qBittorrent is still seeding."
  - "Finish the Plex English-default subtitle client check opportunistically; broad Bazarr automation remains paused."
  - "Tune Bazarr language/provider/scoring rules separately for movies and TV against real library items."
  - "Iterate Kometa v2 only after watched/history behavior is stable."
  - "Coordinate with the Agent Control Plane instead of re-owning Movie Intelligence or agent-wrapper implementation in this workstream."

stale_or_unknown:
  - "Programmatic Plex historical watched-date editing is unverified; UI support alone is not sufficient for batch automation."
  - "The exact medium/full-batch identity enrichment implementation remains owned by the sibling control-plane workstream."
  - "Live ARR roots/mapping drift remains unresolved; historical direct hardlink capability does not verify a fresh actual ARR import."
  - "English default subtitle client behavior without a remembered override remains pending and non-blocking."

portfolio:
