schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "post-migration-media-evolution"

current_gate: >
  Complete one fresh live ARR torrent hardlink sanity check when practical,
  then move directly into Bazarr deployment and subtitle-policy validation.
  The hardlink check is useful post-migration validation but is no longer a
  migration blocker; the desktop migration is already formally closed.

current_state: >
  The desktop media stack is operational and the notebook-to-desktop migration
  is formally closed. A pre-fix torrent import proved that split Docker mounts
  caused duplicate copies instead of hardlinks. The media workstream corrected
  Sonarr and Radarr to share /data, added qBittorrent Remote Path Mapping from
  /downloads to /data/torrents, and verified in-container hardlink capability
  with matching inode 256114799 and links=2. One fresh real ARR import remains
  as a non-blocking sanity check. The next media application priority is Bazarr.
  English subtitles remain primary/default; Bazarr should avoid unnecessary
  duplicate English subtitles while additionally finding high-quality Czech and
  Slovak alternates matched closely to the exact release. Czech is preferred
  over Slovak when both are viable because matching availability is expected to
  be better, while Slovak remains enabled as a useful alternate. After Bazarr,
  Seerr moves forward earlier as the human request/discovery layer and as a
  potential safe request gateway for the separate Agent Control Plane. The
  watched/history layer follows through Trakt/PlexTraktSync plus a Plex-visible
  My Cinema shelf. The local Movie Intelligence media.db remains the durable
  internal personal-state layer owned by the Infrastructure / Agent Control
  Plane workstream; this media workstream owns Plex presentation and sync/media
  behavior around it. Kometa v2 and Curator-facing curation come after the
  watched/history contracts are stable.

exact_next_action: >
  When server access is available, grab one fresh preferably small torrent via
  Sonarr or Radarr, let ARR import it while qBittorrent keeps seeding, and verify
  matching inode numbers with link count >=2. Treat the result as a sanity
  check, not a migration gate. Then deploy/configure Bazarr and validate the
  English-first plus CZ/SK alternate subtitle workflow on real movies and TV.

blockers: []

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, ČSFD/SerialZone ingestion, agent tools,
      API/MCP/control-plane plumbing, stable entity identity, security/audit
      boundaries and future agent-facing wrappers. This workstream should not
      duplicate those responsibilities.
  - component: "Seerr"
    dependency: >
      This workstream owns Seerr deployment, request UX and media-policy
      configuration. The Agent Control Plane may later wrap the Seerr API as a
      controlled write gateway instead of exposing unrestricted direct ARR
      mutations.
  - component: "Watched/history"
    dependency: >
      Design Trakt/PlexTraktSync and My Cinema so they complement rather than
      compete with Movie Intelligence as the durable internal personal-state
      layer.

important_open_loops:
  - "Run one fresh real Sonarr/Radarr torrent import after the shared /data + Remote Path Mapping fix and verify matching inode/link count while qBittorrent is still seeding."
  - "Deploy Bazarr next with English as primary/default, avoid redundant English downloads, fetch high-quality release-matched CZ/SK alternates, prefer Czech over Slovak when both are viable, and retain manual override for difficult releases."
  - "Tune Bazarr language/provider/scoring rules separately for movies and TV and verify them against real library items."
  - "Deploy/configure Seerr after Bazarr as the human request/discovery layer; define media policy here while the sibling control-plane workstream evaluates the Seerr API as a safe agent write gateway."
  - "Design Trakt/PlexTraktSync behavior without creating a competing source of truth against Movie Intelligence media.db."
  - "Prototype My Cinema / persistent watched shelf in Plex so watched titles remain visually browsable after local files are deleted."
  - "Prefer a clean Plex-native watched/history presentation first; evaluate archive/placeholder techniques only if TV-client behavior is inadequate."
  - "Iterate Kometa v2 after watched/history behavior is stable; integrate Curator outputs only after data contracts are clear."
  - "Keep nzb360 premium deferred unless the mobile cockpit proves valuable."
  - "Coordinate with the Agent Control Plane instead of re-owning Observer/Media Operator implementation in this workstream."

stale_or_unknown:
  - "A fresh end-to-end ARR torrent import has not yet verified the corrected Remote Path Mapping in a real post-fix workflow, although direct in-container hardlink creation is verified."
  - "The exact Plex implementation for My Cinema / watched-but-no-longer-local titles is still open and must be validated on the actual TV client."
  - "Exact Trakt/PlexTraktSync synchronization responsibilities relative to Movie Intelligence media.db remain to be designed."
  - "Project-level closure/ownership changes are currently represented on draft PR #5; this workstream file is synced on main while the project rollup remains pending that PR merge."

portfolio:
  milestone: false
  signal: >
    Ownership is now cleanly split into two coordinated tracks: this workstream
    owns Plex/media UX and policy, while the sibling Infrastructure & Agent
    Control Plane owns Movie Intelligence and agent plumbing. Near-term media
    delivery is now focused on Bazarr, then Seerr, then durable watched/history
    presentation, while agent capability can progress in parallel without
    blocking the Plex roadmap.

verification:
  last_verified: "2026-09-17"
  sources:
    - "Verified pre-fix House of Usher inode check on 2026-09-13 showing duplicate copies."
    - "Verified Sonarr/Radarr shared /data Compose change and qBittorrent Remote Path Mapping on 2026-09-13."
    - "Verified in-container hardlink test on 2026-09-13: inode 256114799, links=2 for both paths."
    - "Cross-workstream ownership and execution order reconciled with the Infrastructure / Agent Control Plane roadmap on 2026-09-17."
    - "Bazarr policy clarified on 2026-09-17: English primary/default, CZ/SK release-matched alternates with Czech preferred when both are viable."

sync:
  status: "synced"
  storage: ".project/workstreams/media-automation.yaml"
