  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "watched-history-medium-batch-write-ready"

current_gate: >
  The first medium-cohort identity and history preflight gates are complete. All five
  previously unresolved identities were resolved and persisted, bringing the verified
  cohort to 40 movies with TMDb+IMDb identities. Read-only Plex/Trakt preflight found
  39 safe write candidates and one excluded ambiguous Plex linkage (Backrooms). No
  Trakt or Plex mutation occurred during preflight. The next gate is one bounded
  39-title Trakt-only write batch with per-item read-back, rollback evidence and
  stop-on-anomaly behavior. Plex historical-date automation remains unverified and
  must not be used for bulk historical backfill yet.

current_state: >
  Seerr is accepted end-to-end through Plex. Bazarr broad automation and the fresh
  torrent hardlink check remain non-blocking follow-up. The watched-history/My Cinema
  design has passed a single-item Trakt write acceptance and a bounded five-title
  mini-batch with zero duplicates and precise rollback evidence. The first medium
  cohort is now fully identity-qualified: 40 watched candidates have persisted TMDb
  and IMDb identities in the existing external_ids representation. The five previously
  unresolved cases were resolved without schema change or collision: Hra s vrahem ->
  Woman of the Hour (TMDb 835113), Chuckuv zivot -> The Life of Chuck (TMDb 842924),
  Posedlost -> Obsession (TMDb 1339713; the earlier Forbannelsen hypothesis was a
  different film), Zhoubne zlo -> Malignant (TMDb 619778), and Skrys -> 6 Souls
  (TMDb 41505). watched/rating/CSFD state remained unchanged; backup and detailed
  provenance remain private. Read-only history preflight across all 40 candidates
  found none already present in Trakt from this cohort, 39 safe proposed imports,
  two Plex-confirmed dates, zero earliest-of-multiple Plex-date cases, and 37 explicit
  release-date legacy_placeholder cases. Backrooms was excluded because Plex history
  and metadata exposed conflicting references and the required detail pages were not
  available to establish a stable event-to-title link. The six previously accepted
  Trakt titles remained unchanged and were not proposed again. Sanitized repository
  documentation/state was reported verified on main at 499eb94. A temporary encrypted
  local transfer artifact/key remains an explicit cleanup open loop because automatic
  permission checks previously refused deletion; it remains local with restricted
  permissions.

exact_next_action: >
  Execute one bounded Trakt-only write batch for the 39 already preflighted safe
  candidates using the existing verified identities and proposed date provenance.
  Reuse the completed preflight rather than re-researching stable identities or
  re-running broad account discovery. Before each write, perform only the minimal
  freshness check needed to avoid duplicates; then write sequentially, read back the
  event, verify identity/date/exactly-one-event, store its rollback ID privately, and
  stop the remaining batch on the first ambiguous or anomalous result. Preserve Plex
  and media.db. Keep Backrooms excluded. Do not use CSFD rating dates as viewing dates.

blockers:
  - "A safe programmable Plex account-level historical watched-date write method remains unconfirmed; do not automate Plex historical backfill yet."

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, stable identity enrichment, CSFD/SerialZone
      ingestion, agent tools and control-plane write wrappers. The first 40-title
      medium cohort now has persisted TMDb+IMDb identities; future full-fleet scaling
      should reuse this resolver/provenance pattern rather than repeat manual research.
  - component: "Trakt"
    dependency: >
      OAuth is established privately. Preserve existing history, skip already-present
      titles, use explicit stable IDs, and retain event-specific rollback evidence for
      staged writes. Trakt is portable/shareable cross-source history, not merely a
      Plex mirror.
  - component: "Plex watched/history"
    dependency: >
      Preserve genuine Plex cloud watch events. Existing cloud dates are preferred as
      real-date evidence when available. Where multiple Plex dates exist, the explicitly
      user-authorized earliest-date rule may be used and must be recorded privately.
      Imported legacy items must not overwrite Plex history.

important_open_loops:
  - "Run the already-preflighted 39-title Trakt-only medium batch with minimal freshness checks, per-item read-back, rollback IDs and stop-on-anomaly behavior."
  - "Keep Backrooms excluded until Plex event/title linkage can be independently resolved."
  - "Preserve date provenance: Plex-confirmed, explicitly user-authorized earliest Plex date when multiple events exist, or release-date legacy_placeholder when no real date is known."
  - "Never infer viewing dates from CSFD rating dates."
  - "After medium-batch acceptance, decide whether to scale identity enrichment/history import to the remaining watched fleet; reuse durable resolver evidence and avoid repeating stable checks."
  - "Confirm a safe programmable Plex account-level watched-date write/read-back/rollback path before any automated Plex historical backfill; do not write Plex SQLite directly."
  - "Clean up the temporary local encrypted transfer artifact/key only through an explicitly authorized safe cleanup step; do not expose its contents or secrets."
  - "Run one fresh real Sonarr/Radarr torrent import and verify hardlink inode/link count while qBittorrent is still seeding."
  - "Finish the Plex English-default subtitle client check opportunistically; broad Bazarr automation remains paused."
  - "Tune Bazarr language/provider/scoring rules separately for movies and TV against real library items."
  - "Iterate Kometa v2 only after watched/history behavior is stable."
  - "Coordinate with the Agent Control Plane instead of re-owning Movie Intelligence or agent-wrapper implementation in this workstream."

stale_or_unknown:
  - "Programmatic Plex historical watched-date editing is unverified; UI support alone is not sufficient for batch automation."
  - "Backrooms Plex event/title linkage remains unresolved because the available cloud references conflict and detail pages were unavailable during preflight."
  - "Live ARR roots/mapping drift remains unresolved; historical direct hardlink capability does not verify a fresh actual ARR import."
  - "English default subtitle client behavior without a remembered override remains pending and non-blocking."

