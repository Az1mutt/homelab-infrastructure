schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "migration-acceptance-closure"

current_gate: >
  Fix post-migration torrent import behavior so Sonarr/Radarr create real
  hardlinks instead of duplicate copies on ext4, then repeat the live torrent
  acceptance check before handing the media workstream back to infrastructure
  for formal migration closure.

current_state: >
  The dedicated Ubuntu Server desktop is operational and the media stack is
  functioning end to end. Plex, Kometa, Tautulli, TRaSH/Recyclarr, Usenet
  fallback behavior and monitoring are verified. A real torrent for The Fall
  of the House of Usher completed and was imported into /data/media/tv, but a
  direct inode check on S01E01 proved the torrent file and library file are not
  hardlinks: the torrent-side file had inode 256212997 with links=1 while the
  media-side file had inode 248578695 with links=1. This means the import is a
  duplicate copy and the final torrent-hardlink migration acceptance check has
  failed. Both paths are under /data on the ext4 data disk, so the next step is
  to inspect the current Sonarr container mount layout and the Sonarr hardlink
  import setting before changing or deleting anything. The known SAB-vs-Plex
  disk-I/O contention remains a post-closure optimization, likely to be solved
  later with dedicated SSD scratch storage.

exact_next_action: >
  Inspect the current Sonarr Docker volume mappings and confirm whether the
  torrent download path and TV library are exposed through separate bind mounts
  or a shared /data mount. Then verify that Sonarr's "Use Hardlinks instead of
  Copy" setting is enabled. Do not declare migration acceptance complete until
  a new real torrent import is verified with matching inode numbers and link
  count >=2.

blockers:
  - >
    The final torrent hardlink acceptance check failed: torrent-side and
    media-side S01E01 files have different inode numbers and links=1, proving
    that Sonarr created a duplicate copy rather than a hardlink.

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure, Migration & GitHub"
    dependency: >
      Formal migration closure remains pending until the media workstream fixes
      and re-verifies torrent hardlink imports. If the cause is Docker mount
      topology, infrastructure may need to own the Compose-layout correction.

important_open_loops:
  - "Inspect Sonarr Docker volume mappings for separate /downloads and /tv bind mounts versus a shared /data mount."
  - "Verify Sonarr Settings > Media Management > Use Hardlinks instead of Copy is enabled."
  - "After correction, repeat a real torrent import and verify matching inode/link count on torrent and media paths."
  - "Existing imported torrent/media pairs may currently occupy duplicate disk space; clean them only after verifying the library copy and deciding whether seeding is still needed."
  - "After acceptance, decide with infrastructure whether to unmount, archive, repurpose, or wipe the old rollback disk."
  - "Replace the temporary migration-version override with the permanent image pin/update policy."
  - "Harden backup/restore procedures, retention, and restore drills."
  - "Treat SAB scratch separation as a future performance optimization, likely on SSD; exact device/layout is not yet decided."
  - "Iterate Kometa v2 based on the actual TV experience."
  - "Keep nzb360 premium unlock/subscription deferred for now."
  - "Later media backlog remains Bazarr, Trakt/PlexTraktSync, Seerr, controlled remote access, and media agents."

stale_or_unknown:
  - "The exact reason hardlink creation failed is not yet verified; likely candidates are Docker mount topology or the Sonarr hardlink setting."
  - "Exact future SAB scratch device, size and filesystem are undecided; SSD is currently the likely direction."
  - "The old rollback disk is confirmed still attached read-only, but its final disposition is intentionally undecided until migration closure."

portfolio:
  milestone: true
  signal: >
    The final migration acceptance test caught a real storage-efficiency defect
    that container health checks would have missed: torrent imports work
    functionally but are currently duplicating payloads rather than creating
    ext4 hardlinks. The workstream now has a concrete, evidence-backed gate for
    correcting Docker/ARR import behavior before closure.

verification:
  last_verified: "2026-09-13"
  sources:
    - "Verified project-chat inode check for The Fall of the House of Usher S01E01 on 2026-09-13."
    - "docs/current-state.md"
    - "docs/roadmap.md"

sync:
  status: "synced"
  storage: ".project/workstreams/media-automation.yaml"
