  the released 5.2.4 WebUI/WebAPI still does not expose the required category fields
  reliably for this headless deployment. No live or Git changes were made. Exact
  ARR-category zero-seeding is therefore deferred until a compatible released WebAPI path
  is available. Ongoing watched-sync code remains merged and ready for bounded live
  reconciliation acceptance.

