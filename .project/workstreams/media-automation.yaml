schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "watched-history-small-batch-accepted"

current_gate: >
  The first bounded Trakt watched-history mini-batch is accepted. Five additional
  movies were written successfully with per-item read-back, zero duplicates and
  rollback IDs captured privately. Both provenance paths are now exercised:
  Plex-confirmed dates and explicit release-date legacy placeholders. Before the
  next 25-50 item batch, establish stable TMDb/IMDb enrichment for the watched
  media.db population owned by the Infrastructure & Agent Control Plane workstream.
  Plex historical-date automation remains unverified and must not be used for bulk
  historical backfill yet.

current_state: >
  Seerr is accepted end-to-end through Plex. Bazarr broad automation and the fresh
  torrent hardlink check remain non-blocking follow-up. The watched-history/My
  Cinema design has now passed both a single-item Trakt write acceptance and a
  bounded five-title mini-batch. Existing Plex behavior remains sufficient for the
  visual shelf: watched unavailable titles are browsable with posters on TV. The
  intended model is media.db as internal canonical state, Plex Watch History as the
  private visual shelf, and Trakt as portable/shareable cross-source watch history.
  Read-only discovery previously found that all 556 currently watched Movie
  Intelligence rows carry only CSFD IDs; TMDb/IMDb mappings used in the pilot were
  independently verified temporary mappings and are not yet persisted identities in
  media.db. media.db watched_at values originate from CSFD rating dates and must not
  be treated as proven viewing dates. Trakt OAuth is verified and its token remains
  stored privately on the homelab with mode 0600. The first accepted event was Smile
  2 (2024), TMDb 1100782, using Plex-confirmed date 2026-08-04 with synthetic noon
  exact time. The accepted five-title mini-batch then added Heretic using Plex date
  2026-07-12, Tetris using the earliest Plex date 2026-04-25 with explicit user
  authorization to choose the earliest Plex date, The Fifth Element using release
  date 1997-05-02 as legacy_placeholder, Inside Out 2 using release date 2024-06-10
  as legacy_placeholder, and The Batman using release date 2022-02-23 as
  legacy_placeholder. All five writes were read back immediately with correct
  identity/date, exactly one event each, zero duplicates and precise rollback IDs
  captured privately. Smile 2 remained unchanged. Plex and media.db were not
  modified. No anomalies were observed. A temporary encrypted local transfer
  artifact/key remains an explicit cleanup open loop because automatic permission
  checks refused deletion; it remains local with restricted permissions.

exact_next_action: >
  Hand stable identity enrichment to the Infrastructure & Agent Control Plane
  workstream before scaling: persist trustworthy TMDb/IMDb mappings for the watched
  media.db population, or at minimum for the next 25-50 candidate cohort, without
  relying on title-only matching. Once that identity gate is verified, prepare one
  25-50 title Trakt-only batch: snapshot Plex/Trakt history, preserve real Plex dates
  when available, otherwise use explicit release-date legacy_placeholder values,
  skip existing Trakt history, write sequentially with per-item read-back and
  rollback IDs, and abort the remaining batch on the first ambiguity. Do not modify
  Plex or media.db during the Trakt batch.

blockers:
  - "Stable TMDb/IMDb enrichment for the watched CSFD-only media.db rows is required before the 25-50 item batch and full backfill."
  - "A safe programmable Plex account-level historical watched-date write method remains unconfirmed; do not automate Plex historical backfill yet."

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, stable identity enrichment, CSFD/SerialZone
      ingestion, agent tools and control-plane write wrappers. Persist stable
      TMDb/IMDb identities before medium/full watched-history backfill rather than
      relying on title-only or temporary mappings.
  - component: "Trakt"
    dependency: >
      OAuth is established privately. Use explicit stable IDs, preserve existing
      history, and require event-specific read-back/rollback evidence for staged
      writes. Trakt is portable/shareable cross-source history, not merely a Plex
      mirror.
  - component: "Plex watched/history"
    dependency: >
      Preserve genuine Plex cloud watch events. Existing cloud dates are preferred
      as real-date evidence when available. Where multiple Plex dates exist, an
      explicitly user-authorized deterministic rule such as earliest-date selection
      may be used and must be recorded in the private audit. Imported legacy items
      must later skip existing Plex history and use precise rollback semantics if
      programmable writes are introduced.

important_open_loops:
  - "Persist stable TMDb/IMDb enrichment for the watched media.db population, or at least the next 25-50 candidate cohort, before scaling."
  - "Run one 25-50 title Trakt-only batch after identity enrichment, retaining preflight, per-item read-back, rollback IDs and stop-on-anomaly behavior."
  - "Preserve date provenance: Plex-confirmed, explicitly user-authorized earliest Plex date when multiple events exist, or release-date legacy_placeholder when no real date is known."
  - "Never infer viewing dates from CSFD rating dates."
  - "After medium-batch acceptance, perform full Trakt ingest only after another explicit review gate."
  - "Confirm a safe programmable Plex account-level watched-date write/read-back/rollback path before any automated Plex historical backfill; do not write Plex SQLite directly."
  - "Clean up the temporary local encrypted transfer artifact/key only through an explicitly authorized safe cleanup step; do not expose its contents or secrets."
  - "Run one fresh real Sonarr/Radarr torrent import and verify hardlink inode/link count while qBittorrent is still seeding."
  - "Finish the Plex English-default subtitle client check opportunistically; broad Bazarr automation remains paused."
  - "Tune Bazarr language/provider/scoring rules separately for movies and TV against real library items."
  - "Iterate Kometa v2 only after watched/history behavior is stable."
  - "Coordinate with the Agent Control Plane instead of re-owning Movie Intelligence or agent-wrapper implementation in this workstream."

stale_or_unknown:
  - "Programmatic Plex historical watched-date editing is unverified; UI support alone is not sufficient for batch automation."
  - "The exact medium/full-batch identity enrichment implementation remains owned by the sibling control-plane workstream."
  - "Live ARR roots/mapping drift remains unresolved; historical direct hardlink capability does not verify a fresh actual ARR import."
  - "English default subtitle client behavior without a remembered override remains pending and non-blocking."

portfolio:
  milestone: true
  signal: >
    The My Cinema/Trakt history pipeline has now passed a bounded multi-title live
    acceptance with both real-date and legacy-placeholder provenance. Five additional
    titles were written with correct identity/date, zero duplicates and precise
    rollback evidence while Plex and media.db remained untouched. The remaining
    scaling gate is now identity enrichment rather than write-path reliability.

