schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "bazarr-pilot-safe-checkpoint"

current_gate: >
  Complete the small-sample OpenSubtitles.com and Plex subtitle acceptance.
  Bazarr is deployed, but all pilot assignments are removed at the user's
  requested safe pause. No bulk downloading is enabled. Seerr follows acceptance.

current_state: >
  Bazarr 1.6.1 (LinuxServer v1.6.1-ls365) is deployed in its own Compose project,
  with image pinned by digest, UID/GID 1000, Europe/Bratislava and a healthy
  container. Form-authenticated UI is bound to the host LAN address only.
  Sonarr/Radarr connections and synchronization of 44 series and 34 movie files
  are verified. EN/CZ/SK pilot profile accepts embedded subtitles and uses 90%
  minimum scores for movies and TV. Dune (2021) detected embedded English
  normal/HI tracks and wanted only CZ/SK; four The Boys episodes detected
  embedded EN/CZ and wanted only SK. This is component-tested detection, not
  subtitle download or playback acceptance. At safe pause, no profiles are
  assigned, auto-assignment and subtitle upgrades are disabled, and both
  download histories contain zero records. OpenSubtitles account creation
  was confirmed by the user; provider setup was absent at final inspection.
  Titulky.com is deferred. Seerr remains planned. Migration remains closed.
  Live ARR configuration differs from the prior handoff: Sonarr root is /tv
  and its remote mapping uses /download/ rather than /downloads/. Radarr
  root remains /movies. The latest Sonarr torrent import on 2026-09-13
  retains separate source/library inodes with links=1; timing relative to
  the prior fix is unknown. Fresh post-fix import acceptance remains pending.
  Movie Intelligence media.db and agent/control-plane work remain owned by
  the sibling workstream.

exact_next_action: >
  Finish OpenSubtitles.com setup privately in Bazarr, reassign only the
  bounded pilot sample, inspect exact release/cut/FPS matching, test suitable
  CZ/SK downloads and verify Plex visibility plus English default playback.
  Remove pilot assignments again if acceptance is incomplete. Do not enable
  library-wide profiles or bulk downloads. Investigate ARR path drift before
  the next fresh torrent sanity check without reimporting old media.

blockers: []

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, ČSFD/SerialZone ingestion, agent tools,
      API/MCP/control-plane plumbing, stable entity identity, security/audit
      boundaries and future agent-facing wrappers. This workstream should not
      duplicate those responsibilities.
  - component: "Seerr"
    dependency: >
      This workstream owns Seerr deployment, request UX and media-policy
      configuration. The Agent Control Plane may later wrap the Seerr API as a
      controlled write gateway instead of exposing unrestricted direct ARR
      mutations.
  - component: "Watched/history"
    dependency: >
      Design Trakt/PlexTraktSync and My Cinema so they complement rather than
      compete with Movie Intelligence as the durable internal personal-state
      layer.

important_open_loops:
  - "Run one fresh real Sonarr/Radarr torrent import after the shared /data + Remote Path Mapping fix and verify matching inode/link count while qBittorrent is still seeding."
  - "Finish deployed Bazarr OpenSubtitles.com and Plex small-sample acceptance; no bulk activation before verification."
  - "Tune Bazarr language/provider/scoring rules separately for movies and TV and verify them against real library items."
  - "Deploy/configure Seerr after Bazarr as the human request/discovery layer; define media policy here while the sibling control-plane workstream evaluates the Seerr API as a safe agent write gateway."
  - "Design Trakt/PlexTraktSync behavior without creating a competing source of truth against Movie Intelligence media.db."
  - "Prototype My Cinema / persistent watched shelf in Plex so watched titles remain visually browsable after local files are deleted."
  - "Prefer a clean Plex-native watched/history presentation first; evaluate archive/placeholder techniques only if TV-client behavior is inadequate."
  - "Iterate Kometa v2 after watched/history behavior is stable; integrate Curator outputs only after data contracts are clear."
  - "Keep nzb360 premium deferred unless the mobile cockpit proves valuable."
  - "Coordinate with the Agent Control Plane instead of re-owning Observer/Media Operator implementation in this workstream."

stale_or_unknown:
  - "A fresh end-to-end ARR torrent import has not yet verified the corrected Remote Path Mapping in a real post-fix workflow, although direct in-container hardlink creation is verified."
  - "The exact Plex implementation for My Cinema / watched-but-no-longer-local titles is still open and must be validated on the actual TV client."
  - "Exact Trakt/PlexTraktSync synchronization responsibilities relative to Movie Intelligence media.db remain to be designed."
  - "Project-level closure/ownership changes are currently represented on draft PR #5; this workstream file is synced on main while the project rollup remains pending that PR merge."

portfolio:
  milestone: false
  signal: >
    Ownership is now cleanly split into two coordinated tracks: this workstream
    owns Plex/media UX and policy, while the sibling Infrastructure & Agent
    Control Plane owns Movie Intelligence and agent plumbing. Near-term media
    delivery is now focused on Bazarr, then Seerr, then durable watched/history
    presentation, while agent capability can progress in parallel without
    blocking the Plex roadmap.

