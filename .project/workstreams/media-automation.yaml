  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "hardlink-acceptance-failed-diagnosis-needed"

current_gate: >
  Historical watched-history backfill to Trakt is complete for all 558 watched movies.
  The next non-blocking roadmap check, a fresh real ARR torrent hardlink acceptance,
  failed on a completed Sonarr import. Rick and Morty S09E05 was imported successfully
  and source/library files are on the same device with identical size, but they have
  different inodes and link count 1 on both sides. The import therefore produced a
  separate copy rather than a hardlink.

current_state: >
  Trakt historical migration is complete and Plex historical backfill has not started.
  Fresh real hardlink acceptance is now verified FAIL rather than unknown: a completed
  qBittorrent torrent retained after Sonarr import was compared against the managed
  library file. Sonarr confirms the episode is imported; source and library files share
  the same filesystem/device and byte size, but not the same inode, and both report
  nlink=1. No files or applications were modified during verification. The previously
  assumed hardlink topology is therefore not accepted end-to-end.

exact_next_action: >
  Run a read-only hardlink root-cause diagnosis before changing configuration. Inspect
  the current Sonarr hardlink/copy setting, Sonarr container mount topology and visible
  paths, qBittorrent container mount topology, remote path mapping, and the import log
  for the verified failed sample. Determine whether Sonarr is configured to copy, sees
  source/library through incompatible mount paths, encountered a hardlink failure and
  fell back to copy, or has another specific cause. Do not reimport, move, relink,
  delete, or modify the current files during diagnosis.

blockers:
  - "Fresh real Sonarr torrent hardlink acceptance failed: same device and size, different inode, nlink=1 on both source and library files."
  - "Safe programmable Plex historical watched-date writes remain unconfirmed."

