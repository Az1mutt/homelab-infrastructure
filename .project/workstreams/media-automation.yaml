  - "Process the next 100 of 343 production-eligible remaining watched movies."
  - "Keep the 10 known ambiguity-backlog titles excluded from production cohorts."
  - "Keep newly ambiguous identity skips in the dedicated later ambiguity pass rather than spending production-batch budget on manual research."
  - "Preserve date provenance and never infer viewing dates from CSFD rating dates."
  - "Confirm a safe programmable Plex historical watched-date write/read-back/rollback path before automated Plex backfill."
