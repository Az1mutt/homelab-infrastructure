schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "watched-history-medium-batch-final-readback-pending"

current_gate: >
  The first medium Trakt write batch is nearly complete. Of 39 preflighted safe
  candidates, 38 were written and immediately verified with correct identity/date,
  zero duplicates and rollback IDs captured privately. The final title, Podraz,
  returned HTTP 201 on POST but its immediate read-back failed with a network error;
  the POST was correctly not repeated, so its final Trakt state is currently unknown.
  The batch must remain open until one read-only Trakt check resolves Podraz. Plex
  and media.db remained unchanged.

current_state: >
  The watched-history/My Cinema pipeline has passed single-item, five-title and now
  almost the entire first medium Trakt batch. The medium cohort contains 40 movies
  with persisted TMDb+IMDb identities; history preflight produced 39 safe Trakt
  candidates and excluded Backrooms because Plex event/title linkage remained
  ambiguous. During execution, 38 of those 39 candidates were successfully written
  and verified. Two used Plex-confirmed dates and 36 used explicit release-date
  legacy_placeholder dates. Every verified event has a precise rollback ID stored
  privately and no duplicate was introduced. Podraz was attempted last: Trakt
  returned HTTP 201, but the immediate read-back failed due to a network error.
  Following the stop-on-anomaly rule, the POST was not retried and no further
  mutation occurred. Podraz therefore remains unverified rather than failed or
  accepted. The six earlier accepted Trakt pilot events remain outside this batch and
  unchanged. Plex and media.db were not modified. The temporary encrypted local
  transfer artifact/key remains an explicit cleanup open loop with restricted
  permissions.

exact_next_action: >
  Perform exactly one read-only Trakt history check for Podraz using its already
  verified stable identity. Do not repeat identity resolution, broad account
  discovery, Plex preflight, release-date research or the POST. If exactly one event
  exists with the intended identity/date, capture its rollback/history ID privately
  and close the 39-title medium batch as accepted. If zero, multiple, mismatched or
  otherwise ambiguous events are returned, stop and report the observed state before
  any further write decision. Preserve Plex and media.db.

blockers:
  - "Podraz final Trakt state is unknown after HTTP 201 followed by a network failure on immediate read-back; resolve with one read-only check before closing the medium batch."
  - "A safe programmable Plex account-level historical watched-date write method remains unconfirmed; do not automate Plex historical backfill yet."

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, stable identity enrichment, CSFD/SerialZone
      ingestion, agent tools and control-plane write wrappers. The first 40-title
      medium cohort has persisted TMDb+IMDb identities; future scaling should reuse
      this resolver/provenance pattern rather than repeat manual research.
  - component: "Trakt"
    dependency: >
      OAuth is established privately. Preserve existing history, use explicit stable
      IDs, retain event-specific rollback evidence and never repeat an ambiguous POST.
      Podraz now requires read-only reconciliation only.
  - component: "Plex watched/history"
    dependency: >
      Preserve genuine Plex cloud watch events. Existing cloud dates remain preferred
      as real-date evidence. Plex historical backfill is still separate and unverified.

important_open_loops:
  - "Resolve Podraz with one read-only Trakt lookup; do not repeat its POST unless a later explicit decision is made after observing zero events."
  - "After Podraz reconciliation, close the first medium Trakt batch and decide whether to scale to the remaining watched fleet using durable identity/provenance evidence."
  - "Keep Backrooms excluded until Plex event/title linkage can be independently resolved."
  - "Preserve date provenance: Plex-confirmed, explicitly user-authorized earliest Plex date when multiple events exist, or release-date legacy_placeholder when no real date is known."
  - "Never infer viewing dates from CSFD rating dates."
  - "Confirm a safe programmable Plex account-level watched-date write/read-back/rollback path before any automated Plex historical backfill; do not write Plex SQLite directly."
  - "Clean up the temporary local encrypted transfer artifact/key only through an explicitly authorized safe cleanup step; do not expose its contents or secrets."
  - "Run one fresh real Sonarr/Radarr torrent import and verify hardlink inode/link count while qBittorrent is still seeding."
  - "Finish the Plex English-default subtitle client check opportunistically; broad Bazarr automation remains paused."
  - "Tune Bazarr language/provider/scoring rules separately for movies and TV against real library items."
  - "Iterate Kometa v2 only after watched/history behavior is stable."

stale_or_unknown:
  - "Podraz Trakt event state is unknown until the read-only reconciliation check completes."
  - "Programmatic Plex historical watched-date editing is unverified; UI support alone is not sufficient for batch automation."
  - "Backrooms Plex event/title linkage remains unresolved because available cloud references conflict."
  - "Live ARR roots/mapping drift remains unresolved; historical direct hardlink capability does not verify a fresh actual ARR import."
  - "English default subtitle client behavior without a remembered override remains pending and non-blocking."

portfolio:
  milestone: true
  signal: >
    The first medium Trakt batch executed safely at scale: 38 of 39 candidates are
    verified with zero duplicates and complete rollback evidence. The only remaining
    uncertainty is a single final-item read-back after a successful HTTP 201 response,
    demonstrating that the stop-on-anomaly and resumable-checkpoint design works as
    intended.

verification:
  last_verified: "2026-10-05"
  sources:
    - "2026-10-05 medium Trakt batch checkpoint: target 39, 38 written and verified, 0 pre-existing/skipped, 1 remaining/unverified (Podraz)."
    - "2026-10-05 verified medium-batch provenance: 2 Plex-confirmed dates and 36 legacy_placeholder dates among the 38 accepted writes."
    - "2026-10-05 medium-batch verification: 0 duplicates and rollback IDs captured privately for all 38 verified events."
    - "2026-10-05 Podraz POST returned HTTP 201, immediate read-back failed with a network error, and the POST was not repeated."
    - "2026-10-05 Plex and media.db remained unchanged during the medium Trakt write batch."
    - "2026-10-05 preflight: 40 identity-qualified candidates, 39 safe Trakt proposals, Backrooms excluded."

sync:
