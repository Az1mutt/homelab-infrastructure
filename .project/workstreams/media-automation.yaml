  signal: >
    My Cinema now has verified private account snapshots and Trakt OAuth. Real Plex
    cloud dates can distinguish genuine watched evidence from CSFD rating-date
    artifacts, and the first write is narrowed to one Trakt-only event with precise
    read-back/rollback requirements before any scaling.

