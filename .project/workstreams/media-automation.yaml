  - "Finish the Plex English-default subtitle client check opportunistically; broad Bazarr automation remains paused."
  - "Iterate Kometa v2 now that watched/history behavior is stable."
  - "Clean up the temporary local encrypted transfer artifact/key only through an explicitly authorized safe cleanup step."

