schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "watched-history-medium-batch-accepted"

current_gate: >
  The first medium Trakt history batch is accepted end-to-end. All 39 preflighted
  safe candidates are now verified with correct identity/date, zero duplicates and
  rollback/history IDs captured privately. Podraz was reconciled successfully after
  confirming that the previous no-event lookup used invalid identifier semantics;
  the original HTTP 201 had indicated an added event, and a correctly scoped Trakt-ID
  read found exactly the intended event/date. Plex and media.db remained unchanged.
  The next scaling decision is whether to prepare the remaining watched fleet for
  Trakt import, reusing durable identity/provenance evidence rather than repeating
  broad research. Plex historical-date automation remains a separate unverified gate.

current_state: >
  The watched-history/My Cinema pipeline has now passed single-item, five-title and
  medium-batch Trakt acceptance. The medium cohort contains 40 movies with persisted
  TMDb+IMDb identities; history preflight produced 39 safe Trakt candidates and
  excluded Backrooms because Plex event/title linkage remained ambiguous. All 39 safe
  candidates are now verified in Trakt. Thirty-eight were verified immediately after
  write; the final title, Podraz (TMDb 9277), initially returned HTTP 201 followed by a
  network error on read-back. The POST was correctly not repeated. A later no-event
  result was traced to invalid lookup semantics: item-specific Trakt history reads
  require the internal Trakt item ID rather than the TMDb ID. The saved POST evidence
  indicated the item was added, and a correctly scoped read-only reconciliation found
  exactly one intended event with the intended date and captured its rollback ID
  privately. Final medium-batch result: 39/39 verified, zero duplicates, rollback IDs
  for every event. Across the batch, two events used Plex-confirmed dates and 37 used
  explicit release-date legacy_placeholder dates. The six earlier accepted pilot
  events remain unchanged. Plex and media.db were not modified. The temporary
  encrypted local transfer artifact/key remains an explicit cleanup open loop with
  restricted permissions.

exact_next_action: >
  Decide the next watched-history scaling step using the accepted medium batch as the
  durable reference. If continuing Trakt backfill, hand the remaining watched
  population to Infrastructure & Agent Control Plane for stable TMDb/IMDb enrichment
  in bounded cohorts or a reusable deterministic resolver, then perform narrow
  history preflight and staged writes without re-researching already verified items.
  Keep Backrooms excluded until its Plex event/title linkage can be resolved
  independently. Separately, investigate a safe programmable Plex historical watched-
  date write/read-back/rollback path before any automated Plex backfill.

blockers:
  - "A safe programmable Plex account-level historical watched-date write method remains unconfirmed; do not automate Plex historical backfill yet."

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, stable identity enrichment, CSFD/SerialZone
      ingestion, agent tools and control-plane write wrappers. Future full-fleet
      scaling should reuse verified resolver/provenance patterns and durable state
      rather than repeat manual research.
  - component: "Trakt"
    dependency: >
      OAuth is established privately. Preserve existing history, use explicit stable
      IDs, retain event-specific rollback evidence and use correct Trakt internal-ID
      semantics for item-specific history reads.
  - component: "Plex watched/history"
    dependency: >
      Preserve genuine Plex cloud watch events. Existing cloud dates remain preferred
      as real-date evidence. Plex historical backfill is still separate and unverified.

important_open_loops:
  - "Decide whether to scale Trakt import to the remaining watched fleet; reuse durable identity/provenance evidence and avoid repeating stable checks."
  - "Keep Backrooms excluded until Plex event/title linkage can be independently resolved."
  - "Preserve date provenance: Plex-confirmed, explicitly user-authorized earliest Plex date when multiple events exist, or release-date legacy_placeholder when no real date is known."
  - "Never infer viewing dates from CSFD rating dates."
  - "Use correct Trakt internal item IDs for item-specific history reads; do not treat TMDb IDs as endpoint path IDs."
  - "Confirm a safe programmable Plex account-level watched-date write/read-back/rollback path before any automated Plex historical backfill; do not write Plex SQLite directly."
  - "Clean up the temporary local encrypted transfer artifact/key only through an explicitly authorized safe cleanup step; do not expose its contents or secrets."
  - "Run one fresh real Sonarr/Radarr torrent import and verify hardlink inode/link count while qBittorrent is still seeding."
  - "Finish the Plex English-default subtitle client check opportunistically; broad Bazarr automation remains paused."
  - "Tune Bazarr language/provider/scoring rules separately for movies and TV against real library items."
  - "Iterate Kometa v2 only after watched/history behavior is stable."

stale_or_unknown:
  - "Programmatic Plex historical watched-date editing is unverified; UI support alone is not sufficient for batch automation."
  - "Backrooms Plex event/title linkage remains unresolved because available cloud references conflict."
  - "Live ARR roots/mapping drift remains unresolved; historical direct hardlink capability does not verify a fresh actual ARR import."
  - "English default subtitle client behavior without a remembered override remains pending and non-blocking."

portfolio:
  milestone: true
  signal: >
    The first medium Trakt history batch is fully accepted: 39 of 39 candidates were
    verified with zero duplicates and complete rollback evidence. The final-item
    reconciliation also exposed and resolved a reusable API semantics issue: item-
    specific Trakt history reads require Trakt internal IDs, not TMDb IDs. The pipeline
    is now proven at medium scale and ready for a deliberate full-fleet scaling decision.

