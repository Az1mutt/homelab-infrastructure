status: "active"
phase: "seerr-deployment-with-bazarr-open-loop"

current_gate: >
  Proceed with Seerr deployment/configuration as the next active media task.
  Keep Bazarr broad automation paused and its remaining English-default and
  unattended subtitle-match reliability checks open as non-blocking follow-up.

current_state: >
  Bazarr 1.6.1 remains healthy with verified Sonarr/Radarr integration,
  44 series and 34 movie files. OpenSubtitles.com login/search/download works
  after the user confirmed the account email. Dune candidates at 73% were
  rejected for missing source/release-group matches. Exactly one Czech subtitle
  was downloaded for The Game (1997), provider ID 374530, score 90.56%.
  The BX Blu-ray subtitle matched title/year/source/resolution but not the
  CtrlHD video release group, hash or codecs. The initial timing failed the
  user playback check. Independent comparison against embedded English found
  stable offsets of +14.68/+14.72/+14.72 seconds with scale 1.000. Applied
  +14.72 seconds only to the new Czech subtitle, preserving all 1196 cues/text
  and a private original backup; the user confirmed corrected timing.
  Plex sees the external Czech SRT and the original English track.
  Account settings now enable automatic track selection, English subtitles
  and Always enabled. Actual automatic English selection on an item without
  a manual override remains to be confirmed. The Game remembers the user's
  manual Czech selection. No Slovak download or equal-quality CZ/SK tie-break
  was tested. Profiles are unassigned again, defaults and upgrades disabled,
  and history contains one movie subtitle download and zero episode downloads.
  No redeployment or unrelated setting changes were made. ARR path drift
  remains: Sonarr /tv with /download/ mapping, Radarr /movies with /downloads/
  mapping, both targeting /data/torrents/. No old media was changed to force
  hardlink validation. Migration stays closed; fresh hardlink sanity check
  remains non-blocking. On 2026-09-25 the user explicitly chose to leave the
  remaining Bazarr client/default and unattended-match acceptance open and move
  on to Seerr. Seerr is now the next active media implementation task.

exact_next_action: >
  Inspect the current live media Compose/application state, then deploy and
  configure Seerr as the human-facing discovery/request layer over Radarr and
  Sonarr without creating a conflicting quality or acquisition-policy layer.
  Preserve existing ARR profiles and Usenet-first/manual-torrent behavior.
  Keep Bazarr profiles, bulk assignment and upgrades disabled; finish its
  English-default and broader match-reliability checks later as an open loop.
  Investigate ARR path drift before a future fresh torrent import without
  reimporting old media.

blockers: []

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, ČSFD/SerialZone ingestion, agent tools,
      API/MCP/control-plane plumbing, stable entity identity, security/audit
      boundaries and future agent-facing wrappers. This workstream should not
      duplicate those responsibilities.
  - component: "Seerr"
    dependency: >
      This workstream owns Seerr deployment, request UX and media-policy
      configuration. The Agent Control Plane may later wrap the Seerr API as a
      controlled write gateway instead of exposing unrestricted direct ARR
      mutations.
  - component: "Watched/history"
    dependency: >
      Design Trakt/PlexTraktSync and My Cinema so they complement rather than
      compete with Movie Intelligence as the durable internal personal-state
      layer.

important_open_loops:
  - "Run one fresh real Sonarr/Radarr torrent import after the shared /data + Remote Path Mapping fix and verify matching inode/link count while qBittorrent is still seeding."
  - "Finish the Plex English-default client check opportunistically; OpenSubtitles download and corrected Czech timing passed, but unattended matching remains unproven and broad Bazarr automation stays paused."
  - "Tune Bazarr language/provider/scoring rules separately for movies and TV and verify them against real library items."
  - "Deploy/configure Seerr now as the human request/discovery layer; define media policy here while the sibling control-plane workstream evaluates the Seerr API as a safe agent write gateway."
  - "Design Trakt/PlexTraktSync behavior without creating a competing source of truth against Movie Intelligence media.db."
  - "Prototype My Cinema / persistent watched shelf in Plex so watched titles remain visually browsable after local files are deleted."
  - "Prefer a clean Plex-native watched/history presentation first; evaluate archive/placeholder techniques only if TV-client behavior is inadequate."
  - "Iterate Kometa v2 after watched/history behavior is stable; integrate Curator outputs only after data contracts are clear."
  - "Keep nzb360 premium deferred unless the mobile cockpit proves valuable."
  - "Coordinate with the Agent Control Plane instead of re-owning Observer/Media Operator implementation in this workstream."

