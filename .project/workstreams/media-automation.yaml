  signal: >
    The My Cinema history pipeline has its first successful live write acceptance:
    one precisely identified Trakt event was created, read back without duplication,
    and given event-specific rollback evidence while Plex and media.db remained
    untouched. The rollout now moves to a bounded small batch with per-item safety
    checks rather than requiring manual approval after every single title.

