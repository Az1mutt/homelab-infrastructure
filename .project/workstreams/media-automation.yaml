status: "active"
phase: "watched-history-medium-batch-reconciliation"

current_gate: >
  The first medium Trakt batch has 38 of 39 candidates fully verified with correct
  identity/date, zero duplicates and rollback IDs captured privately. Podraz returned
  HTTP 201 on its POST, the immediate read-back then failed with a network error, and
  a later narrow read-only check reported no event. No POST has been repeated. Before
  treating Podraz as absent, verify that the read-only lookup used Trakt's required
  internal item identifier/semantics and inspect the already-saved POST response if
  available. Plex and media.db remain unchanged.

current_state: >
  The medium cohort contains 40 movies with persisted TMDb+IMDb identities; preflight
  produced 39 safe Trakt candidates and excluded Backrooms because Plex event/title
  linkage remained ambiguous. Thirty-eight of the 39 candidates were written and
  immediately verified: two used Plex-confirmed dates and 36 used explicit
  release-date legacy_placeholder dates. Every verified event has a precise rollback
  ID stored privately and zero duplicates were introduced. Podraz (TMDb 9277) was the
  final attempted item. Its POST returned HTTP 201, immediate read-back failed due to
  a network error, and the POST was correctly not repeated. A subsequent read-only
  check reported no event, no matching identity/date and zero duplicates. This does
  not yet authorize a retry because the Trakt API's item-specific history lookup is
  keyed by Trakt's internal item ID rather than an external TMDb ID; the exact lookup
  semantics used in the failed reconciliation must be verified first. The six earlier
  accepted Trakt pilot events remain unchanged. Plex and media.db were not modified.
  The temporary encrypted local transfer artifact/key remains an explicit cleanup
  open loop with restricted permissions.

exact_next_action: >
  Perform a narrow READ-ONLY reconciliation for Podraz only. Do not repeat the POST.
  First inspect the saved HTTP 201 response/request evidence, if retained, for returned
  add/not-found details or a history ID. Then verify the exact endpoint/identifier used
  by the later history check. Resolve TMDb 9277 to the corresponding Trakt internal
  movie ID and query history using correct Trakt-ID semantics, or use an equivalently
  exact read-only method that matches returned external IDs. If exactly one intended
  event exists, capture its rollback/history ID privately and close the batch. If a
  correctly scoped lookup definitively shows zero events and the saved POST response
  yields no event ID, stop and report that evidence before any retry decision.

blockers:
  - "Podraz remains unresolved after HTTP 201, immediate network read-back failure, and a later no-event read-only result whose identifier semantics must be verified before concluding the write was absent."
  - "A safe programmable Plex account-level historical watched-date write method remains unconfirmed; do not automate Plex historical backfill yet."

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, stable identity enrichment, CSFD/SerialZone
      ingestion, agent tools and control-plane write wrappers. Future full-fleet
      scaling should reuse verified identities and durable resolver/provenance evidence.
  - component: "Trakt"
    dependency: >
      OAuth is established privately. Preserve existing history, use explicit stable
      IDs, retain event-specific rollback evidence and never repeat an ambiguous POST.
      Item-specific history reads must use correct Trakt identifier semantics.
  - component: "Plex watched/history"
    dependency: >
      Preserve genuine Plex cloud watch events. Existing cloud dates remain preferred
      as real-date evidence. Plex historical backfill is still separate and unverified.

important_open_loops:
