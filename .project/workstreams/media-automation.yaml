schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "watched-history-single-item-write-ready"

current_gate: >
  Trakt OAuth and account-level Plex/Trakt read-only snapshots are complete. The
  next gate is a single Trakt-only write acceptance for Smile 2, preserving the
  existing Plex cloud event. Plex historical-date automation remains unverified
  and is not required for this first Trakt-only pilot. Medium/full backfill must
  still wait for stable TMDb/IMDb enrichment in media.db and staged acceptance.

current_state: >
  Seerr is accepted end-to-end through Plex. Bazarr broad automation and the fresh
  torrent hardlink check remain non-blocking follow-up. The watched-history/My
  Cinema design has progressed from read-only preflight to a bounded single-item
  Trakt write pilot. Existing Plex behavior is sufficient for the visual shelf:
  watched unavailable titles remain browsable with posters on TV. The intended
  model is media.db as internal canonical state, Plex Watch History as the private
  visual shelf, and Trakt as portable/shareable cross-source watch history.
  Read-only discovery previously found that all 556 currently watched Movie
  Intelligence rows carry only CSFD IDs; TMDb/IMDb mappings for the pilot are
  temporary Seerr-verified proposals and are not yet persisted identities in
  media.db. Current media.db watched_at values originate from CSFD rating dates
  and must not be treated as proven viewing dates. Trakt OAuth is now verified and
  its token is stored privately on the homelab with mode 0600. Read-only Trakt
  history contains no events for Smile 2, The Fifth Element, Heretic or
  Inglourious Basterds. Plex cloud history now confirms Smile 2 on 2026-08-04,
  Heretic on 2026-07-12 and Inglourious Basterds on 2026-09-01; The Fifth Element
  was not found. This independently proves that CSFD rating dates cannot be used as
  viewing dates in general: Heretic's media.db/CSFD-derived date was 2026-07-14,
  while Plex cloud history shows 2026-07-12. Existing Plex history must therefore
  be preserved and preferred as evidence when present. Plex cloud snapshots expose
  dates but not precise times or event IDs suitable for precise rollback. No Plex,
  Trakt history or media.db mutation has occurred yet. A temporary encrypted local
  transfer artifact/key remains as an explicit cleanup open loop because automatic
  permission checks refused deletion; it remains local with restricted permissions.

exact_next_action: >
  Perform exactly one Trakt-only history write for Smile 2 (TMDb 1100782), using
  the Plex-confirmed real watch date 2026-08-04 while marking the exact time as
  synthetic in the private audit manifest. Prefer 12:00 Europe/Bratislava
  (2026-08-04T10:00:00Z) to avoid accidental date rollover. Do not modify Plex,
  media.db, or any other Trakt title. Immediately read back the new Trakt event,
  verify identity and displayed date, capture its event/history ID for precise
  rollback, and stop. If any result is ambiguous, do not retry the write.

blockers:
  - "A safe programmable Plex account-level historical watched-date write method remains unconfirmed; this does not block the first Trakt-only Smile 2 pilot."
  - "Stable TMDb/IMDb enrichment for the 556 watched CSFD-only rows is required before medium/full backfill."

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure & Agent Control Plane"
    dependency: >
      Own Movie Intelligence media.db, stable identity enrichment, CSFD/SerialZone
      ingestion, agent tools and control-plane write wrappers. Before medium/full
      watched-history backfill, persist stable TMDb/IMDb identities for the 556
      watched CSFD-only rows rather than relying on title-only or temporary mappings.
  - component: "Trakt"
    dependency: >
      OAuth is now established privately. Use explicit stable IDs, preserve existing
      history, and require event-specific read-back/rollback evidence for staged
      writes. Trakt is portable/shareable cross-source history, not merely a Plex
      mirror.
  - component: "Plex watched/history"
    dependency: >
      Preserve genuine Plex cloud watch events. Smile 2, Heretic and Inglourious
      Basterds already have cloud history and must not be overwritten during the
      Trakt pilot. Imported legacy items must later skip existing Plex history and
      use precise rollback semantics if programmable writes are introduced.

important_open_loops:
  - "Run exactly one Trakt-only write for Smile 2, read it back, capture precise rollback ID, and stop before expanding the pilot."
  - "After single-item acceptance, complete the remaining 3-5 pilot with explicit per-title date provenance; do not infer viewing dates from CSFD rating dates."
  - "For The Fifth Element, no Plex cloud history exists; any future historical date must remain explicitly synthetic/legacy unless another real source is found."
  - "Persist stable TMDb/IMDb enrichment for all 556 watched CSFD-only rows before medium/full backfill."
  - "Run the watched-history rollout in stages: 1 item, then 3-5 pilot, then ~25-50 batch, then full ingest only after acceptance."
  - "Confirm a safe programmable Plex account-level watched-date write/read-back/rollback path before any automated Plex historical backfill; do not write Plex SQLite directly."
  - "Clean up the temporary local encrypted transfer artifact/key only through an explicitly authorized safe cleanup step; do not expose its contents or secrets."
  - "Run one fresh real Sonarr/Radarr torrent import and verify hardlink inode/link count while qBittorrent is still seeding."
  - "Finish the Plex English-default subtitle client check opportunistically; broad Bazarr automation remains paused."
  - "Tune Bazarr language/provider/scoring rules separately for movies and TV against real library items."
  - "Iterate Kometa v2 only after watched/history behavior is stable."
  - "Coordinate with the Agent Control Plane instead of re-owning Movie Intelligence or agent-wrapper implementation in this workstream."

stale_or_unknown:
  - "Programmatic Plex historical watched-date editing is unverified; UI support alone is not sufficient for batch automation."
  - "The exact medium/full-batch identity enrichment implementation remains owned by the sibling control-plane workstream."
  - "Live ARR roots/mapping drift remains unresolved; historical direct hardlink capability does not verify a fresh actual ARR import."
  - "English default subtitle client behavior without a remembered override remains pending and non-blocking."

portfolio:
