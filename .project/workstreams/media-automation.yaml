schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Plex, Kometa & Media Automation"
  owner: "Plex, Kometa & Media Automation specialist chat"

status: "active"
phase: "migration-acceptance-closure"

current_gate: >
  Fix post-migration torrent import behavior so Sonarr/Radarr create real
  hardlinks instead of duplicate copies on ext4, then repeat the live torrent
  acceptance check before handing the media workstream back to infrastructure
  for formal migration closure.

current_state: >
  The desktop media stack is functioning end to end, but the final torrent
  hardlink acceptance test failed. The Fall of the House of Usher S01E01 had
  different inode numbers and links=1 on the torrent and library paths. Docker
  inspection confirms Sonarr sees /data/torrents as a separate /downloads bind
  mount and /data/media/tv as a separate /tv bind mount. Sonarr's "Use
  Hardlinks instead of Copy" setting is confirmed enabled. The remaining cause
  is therefore the split Docker mount topology: although both host paths live
  on the same ext4 /data filesystem, they are presented to the container as
  separate mount points, preventing the intended hardlink workflow. qBittorrent
  continuing to seed the source torrent is expected and is not the cause of
  the failed hardlink creation. The Sonarr warning about file locks concerns
  rename operations on files being seeded, not this inode/link-count failure.
  SAB-vs-Plex disk-I/O contention remains a post-closure optimization, likely
  to be solved later with dedicated SSD scratch storage.

exact_next_action: >
  Hand the mount-layout correction to infrastructure: expose a single shared
  /data bind mount to Sonarr and align torrent and TV paths under that mount
  instead of separate /downloads and /tv mounts. Apply the equivalent pattern
  to Radarr as appropriate. Then repeat a real torrent import and verify the
  torrent-side and media-side files have matching inode numbers and link count
  >=2 while qBittorrent continues seeding.

blockers:
  - >
    Sonarr currently sees torrent downloads and the TV library through separate
    Docker bind mounts (/downloads and /tv), so imported torrent payloads are
    copied rather than hardlinked despite the hardlink option being enabled.

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Infrastructure, Migration & GitHub"
    dependency: >
      Own the Compose/mount-layout correction because this is an
      infrastructure-level container path change.

important_open_loops:
  - "Replace separate /downloads and /tv binds with a shared /data mount for ARR hardlink compatibility, subject to infrastructure ownership."
  - "Apply equivalent shared-path design to Radarr if its current mount topology has the same split-bind pattern."
  - "Repeat a real torrent import after correction and verify matching inode/link count on torrent and media paths while qBittorrent is still seeding."
  - "Existing imported torrent/media pairs may occupy duplicate disk space; clean them only after confirming the library copy and seeding requirement."
  - "After acceptance, decide with infrastructure whether to unmount, archive, repurpose, or wipe the old rollback disk."
  - "Replace the temporary migration-version override with the permanent image pin/update policy."
  - "Harden backup/restore procedures, retention, and restore drills."
  - "Treat SAB scratch separation as a future performance optimization, likely on SSD; exact device/layout is not yet decided."
  - "Iterate Kometa v2 based on the actual TV experience."
  - "Keep nzb360 premium unlock/subscription deferred for now."
  - "Later media backlog remains Bazarr, Trakt/PlexTraktSync, Seerr, controlled remote access, and media agents."

stale_or_unknown:
  - "Exact future SAB scratch device, size and filesystem are undecided; SSD is currently the likely direction."
  - "The old rollback disk is confirmed still attached read-only, but its final disposition is intentionally undecided until migration closure."

portfolio:
  milestone: true
  signal: >
    The final migration acceptance test caught a subtle container-path design
    defect: service health and imports worked, but split Docker bind mounts
    defeated ext4 hardlinking and silently doubled storage use. The ARR
    hardlink setting is now confirmed correct, isolating the problem to Docker
    mount topology.

verification:
  last_verified: "2026-09-13"
  sources:
    - "Verified project-chat inode check for The Fall of the House of Usher S01E01 on 2026-09-13."
    - "Verified docker inspect output on 2026-09-13 showing /data/torrents -> /downloads and /data/media/tv -> /tv."
    - "Verified Sonarr UI on 2026-09-13 showing Use Hardlinks instead of Copy enabled."
    - "docs/current-state.md"
    - "docs/roadmap.md"

sync:
  status: "synced"
  storage: ".project/workstreams/media-automation.yaml"
