  Validate and resolve the 15 deterministic/easy ambiguity cases first, without touching
  the four research-heavy titles or Backrooms. Reuse retained unique linkage evidence,
  perform only narrow title/year/identity validation, persist a mapping only when the
  result is high-confidence and non-conflicting, then process any newly resolved titles
  through the standard Trakt freshness -> single POST if absent -> read-back -> rollback
  capture workflow. Stop and defer any case that remains ambiguous.

