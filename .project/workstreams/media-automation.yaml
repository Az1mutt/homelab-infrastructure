  - "Live ARR roots/mapping drift remains unresolved; historical direct hardlink capability does not verify a fresh actual ARR import."
  - "English default client behavior without a remembered override remains pending and is explicitly non-blocking for Seerr. High subtitle score did not prevent the pilot timing mismatch; no SK download/equal-quality CZ-SK tie-break tested."
  - "The exact Plex implementation for My Cinema / watched-but-no-longer-local titles is still open and must be validated on the actual TV client."
  - "Exact Trakt/PlexTraktSync synchronization responsibilities relative to Movie Intelligence media.db remain to be designed."
  - "Project-level closure/ownership changes are currently represented on draft PR #5; this workstream file is synced on main while the project rollup remains pending that PR merge."

portfolio:
