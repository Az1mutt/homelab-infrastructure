schema_version: "0.2"

project:
  name: "Homelab & Media Stack"
  workstream: "Infrastructure, Migration & GitHub"
  owner: "Homelab Infrastructure specialist chat"

status: "active"
phase: "migration-closed-post-migration-operations-and-movie-intelligence"

current_gate: >
  Operationalize the verified Movie Intelligence foundation with a
  low-frequency scheduled ČSFD ratings sync, then continue non-blocking
  infrastructure hardening and cleanup.

current_state: >
  The notebook-to-desktop homelab migration is formally closed as of
  2026-09-09 based on owner acceptance in this specialist workstream. The
  dedicated Ubuntu Server desktop remains the production target and remaining
  media/infrastructure checks are post-migration follow-ups rather than closure
  blockers. A local Movie Intelligence foundation is verified on the desktop:
  SQLite media.db is in WAL mode with 682 unique movies, 556 watched/rated,
  126 watchlist, and 0 rows in both states. The one-time private ČSFD
  watchlist bootstrap parsed 142 source items across three pages; 132
  movie-like items were considered for import and 10 series/season items were
  excluded for a future SerialZone path. Six watchlist items already existed
  as watched, so watched status correctly took precedence. The public ČSFD
  ratings sync works and a repeat run processed 556 existing rows with
  0 additions, confirming no duplicate creation. A systemd oneshot service
  (movie-intelligence-csfd-sync.service) has now been created and manually
  verified end-to-end: on 2026-09-13 it completed successfully with 556 seen,
  0 added and 556 updated, exiting cleanly under systemd.

exact_next_action: >
  Create the systemd timer for movie-intelligence-csfd-sync.service on a
  twice-monthly cadence (1st and 15th at 04:15), then enable it and verify the
  next scheduled run with systemctl list-timers.

blockers: []

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Plex, Kometa & Media Automation"
    dependency: >
      Continue media-specific follow-ups such as Sonarr TRaSH/Recyclarr,
      Kometa and ARR hardlink validation as non-blocking post-migration work.
  - component: "Movie Intelligence"
    dependency: >
      node-csfd-api, better-sqlite3 and the systemd oneshot sync service are
      installed and verified; only timer scheduling remains for this gate.

important_open_loops:
  - "Deploy the twice-monthly ČSFD ratings timer and verify its schedule/logging."
  - "Use SQLite-aware backup semantics for future online backups; avoid naive copy while WAL writes may be active."
  - "Keep the one-time ČSFD private watchlist export out of GitHub; it contains private/session-adjacent page data."
  - "Future TV/series ingestion should use a separate SerialZone importer; 10 series/season items were intentionally excluded from the film bootstrap."
  - "Design controlled/idempotent agent operations for add-to-watchlist, mark-watched and future Radarr synchronization instead of unrestricted DB writes."
  - "Retire/unmount the old rollback source disk when convenient now that migration closure is accepted."
  - "Replace the temporary migration-version override with a permanent container image pin/update policy."
  - "Continue secrets hardening, backup/restore maturity and later infrastructure monitoring as post-migration operations."

portfolio:
  milestone: true
  signal: >
    Formally closed the staged notebook-to-desktop Ubuntu Server migration and
    moved the project into post-migration operations. The platform now also
    hosts a source-agnostic local movie-intelligence data layer on SQLite with
    verified ČSFD ingestion, private watchlist bootstrap and a tested systemd
    execution path, creating a practical foundation for future media agents
    and Radarr integration.

