schema_version: "0.2"

project:
  name: "Homelab & Media Stack"
  workstream: "Infrastructure, Migration & GitHub"
  owner: "Homelab Infrastructure specialist chat"

status: "active"
phase: "post-migration-operations-and-movie-intelligence"

current_gate: >
  Finish the safe two-source movie read layer and establish the request/write
  boundary before enabling any production agent mutation. The sibling Plex /
  Media Automation workstream can continue independently with its final
  hardlink sanity check and then Bazarr.

current_state: >
  The notebook-to-desktop migration is formally closed. Movie Intelligence is
  operational on the desktop with SQLite media.db in WAL mode, 682 unique
  movies, 556 watched/rated, 126 watchlist, and 0 rows in both states. The
  ČSFD ratings sync service and twice-monthly systemd timer are installed; the
  manual systemd service run was verified successfully, while the first
  unattended scheduled run still needs journal verification. The first
  agent-facing read tools are verified: lookup_movie.mjs returns structured
  Movie Intelligence state, and get_radarr_movie_status.mjs returns narrow
  credential-safe Radarr state for both present and absent movies. The roadmap
  has now been reorganized into two coordinated workstreams: this workstream
  owns infrastructure, Movie Intelligence and the agent control plane, while
  the sibling Plex / Kometa & Media Automation workstream owns Plex UX,
  Bazarr, Kometa, media-policy behavior, Trakt/PlexTraktSync and Seerr
  deployment/configuration. Media-agent work is no longer treated as a single
  final phase; Observer foundations are already active here, with future write
  actions gated behind stronger identity resolution and a deliberate request
  gateway decision.

exact_next_action: >
  Verify the first unattended ČSFD timer-triggered run in the systemd journal,
  then implement and test scripts/get_movie_status.mjs as a read-only
  aggregator over media.db and Radarr. After that, add stable TMDb-based entity
  resolution and evaluate Seerr as the preferred agent request/write gateway
  before enabling direct Radarr/Sonarr mutations.

blockers: []

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Plex, Kometa & Media Automation"
    dependency: >
      Complete the remaining one-film ARR hardlink sanity check when practical,
      then proceed to Bazarr. Later deploy/configure Seerr and define its media
      request policy; this workstream may consume the Seerr API as a controlled
      agent write boundary.
  - component: "Movie Intelligence"
    dependency: >
      SQLite media.db, scheduled ČSFD sync, lookup_movie.mjs and the read-only
      Radarr wrapper are verified foundations. Unified status aggregation and
      stable external-ID resolution remain next.
  - component: "Request gateway"
    dependency: >
      Decide whether Seerr should be the default agent request/write gateway
      before production movie-download mutations are exposed. Direct ARR writes
      should be used only where the request gateway cannot express the required
      operation cleanly.

important_open_loops:
  - "Verify the first unattended timer-triggered ČSFD sync and journal logging."
  - "Implement the aggregate get_movie_status view spanning media.db and Radarr."
  - "Add stronger identity resolution using stable external IDs such as TMDb before any write action."
  - "Evaluate Seerr as the preferred narrow agent request/write boundary versus direct Radarr/Sonarr mutation."
  - "Keep Movie Intelligence as the durable internal personal-state layer unless a later ADR deliberately changes that decision."
  - "Define Movie Intelligence ↔ Trakt/Plex synchronization responsibilities without creating competing sources of truth."
  - "Define how watched-but-no-longer-local titles should be represented in Plex My Cinema."
  - "Future TV/series ingestion should use a separate SerialZone importer and coordinated Sonarr model."
  - "Use SQLite-aware backup semantics for future online backups; avoid naive copy while WAL writes may be active."
  - "Keep the one-time ČSFD private watchlist export out of GitHub."
  - "Retire/unmount the old rollback source disk when convenient."
  - "Replace the temporary migration-version override with a permanent container image pin/update policy."
  - "Continue secrets hardening, backup/restore maturity and infrastructure monitoring as post-migration operations."

portfolio:
  milestone: false
  signal: >
    The project now has a clearer product architecture: a local Movie
    Intelligence data layer, a separate Plex/media UX workstream, and a narrow
    agent control plane progressing from observation toward validated actions.
    This preserves the earlier migration and Movie Intelligence milestones
    while reducing duplicated ownership across chats.

