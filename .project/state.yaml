schema_version: "0.2"

state_scope: "project_rollup"

project:
  name: "Homelab & Media Stack"
  owner: "Project OS rollup"

status: "active"
phase: "migration-acceptance-closure"

current_gate: >
  Complete the media workstream's final torrent import/hardlink acceptance
  check, then let the infrastructure workstream formally close the desktop
  migration and decide the disposition of the old rollback disk.

current_state: >
  The dedicated Ubuntu Server desktop is operational and the media stack is
  functioning end to end. Infrastructure migration is substantially complete.
  Media validation has progressed through Plex, Kometa, Tautulli, TRaSH/
  Recyclarr, Usenet fallback behavior and monitoring. One live torrent
  import/hardlink acceptance check remains before formal migration closure.
  Infrastructure-specific cleanup such as rollback-disk disposition, permanent
  image pin/update policy and backup hardening remains owned by the
  Infrastructure workstream.

exact_next_action: >
  Media Automation completes the in-progress torrent import/hardlink test and
  records its result in its workstream state. If it passes, Infrastructure
  refreshes its workstream state and performs formal migration closure.

blockers:
  - "Final migration closure waits on the media workstream's torrent import/hardlink acceptance check."

workstreams:
  - id: "infrastructure"
    path: ".project/workstreams/infrastructure.yaml"
    owner: "Homelab Infrastructure specialist chat"
  - id: "media-automation"
    path: ".project/workstreams/media-automation.yaml"
    owner: "Plex, Kometa & Media Automation specialist chat"

rollup_policy:
  specialist_writes_root: false
  generated_from:
    - ".project/workstreams/infrastructure.yaml"
    - ".project/workstreams/media-automation.yaml"

portfolio:
  milestone: true
  signal: >
    Homelab migration and media-stack stabilization together provide a strong
    portfolio story around safe infrastructure migration, rollback discipline,
    storage/filesystem design, Docker service recovery, monitoring and
    application-level validation.

verification:
  last_verified: "2026-09-08"
  sources:
    - ".project/workstreams/infrastructure.yaml"
    - ".project/workstreams/media-automation.yaml"

sync:
  status: "synced"
  storage: ".project/state.yaml"
