    - "Owner acceptance in specialist chat 2026-09-09: migration can be formally closed."
    - "Specialist-chat command output 2026-09-06: media.db sanity check = 682 total / 556 watched / 126 watchlist / 0 both."
    - "Specialist-chat command output 2026-09-06: repeat ČSFD ratings sync = 556 seen / 0 added / 556 existing rows processed."
