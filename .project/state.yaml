schema_version: "0.2"

project:
  name: "Homelab & Media Stack"
  workstream: "Infrastructure, Migration & GitHub"
  owner: "Homelab Infrastructure specialist chat"

status: "active"
phase: "post-migration-operations-and-movie-intelligence"

current_gate: >
  Move from data-ingestion foundation into a controlled Homelab/Media Agent
  interface, starting with narrow observable/query capabilities and then
  explicit write actions rather than unrestricted shell or SQL access.

current_state: >
  The notebook-to-desktop homelab migration is formally closed. Movie
  Intelligence is operational on the desktop with SQLite media.db in WAL mode,
  682 unique movies, 556 watched/rated, 126 watchlist, and 0 rows in both
  states. The one-time private ČSFD watchlist bootstrap is complete, and the
  public ČSFD ratings sync is verified as idempotent at the data-identity level.
  A systemd oneshot service for scripts/sync_csfd.mjs is verified end-to-end:
  the 2026-09-13 manual systemd run completed successfully with 556 seen,
  0 added and 556 existing rows processed. A persistent systemd timer is now
  enabled and active, scheduled for the 1st and 15th day of each month at
  04:15 in the host's systemd timezone. systemctl confirmed the timer is
  active (waiting) and the next trigger was 2026-09-15 04:15:00 UTC.

exact_next_action: >
  Define and implement the first narrow agent-facing Movie Intelligence tool
  contract, beginning with read/query operations such as resolving a movie,
  checking watched/watchlist/library state and exposing structured results;
  keep future Radarr write actions explicit, validated, logged and allowlisted.

blockers: []

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Plex, Kometa & Media Automation"
    dependency: >
      Continue media-specific follow-ups such as Sonarr TRaSH/Recyclarr,
      Kometa and ARR hardlink validation as non-blocking post-migration work.
  - component: "Movie Intelligence"
    dependency: >
      SQLite media.db, node-csfd-api, better-sqlite3 and the scheduled ČSFD
      systemd sync are verified and available as the data foundation for future
      agent tools.

important_open_loops:
  - "Verify the first unattended timer-triggered ČSFD sync after a scheduled run and confirm journal logging."
  - "Use SQLite-aware backup semantics for future online backups; avoid naive copy while WAL writes may be active."
  - "Keep the one-time ČSFD private watchlist export out of GitHub; it contains private/session-adjacent page data."
  - "Future TV/series ingestion should use a separate SerialZone importer; 10 series/season items were intentionally excluded from the film bootstrap."
  - "Design controlled/idempotent agent operations for add-to-watchlist, mark-watched and Radarr synchronization instead of unrestricted DB writes."
  - "Evolve Homelab Observer toward an actionable control plane: observe first, then narrow actions such as add/search movie in Radarr, without generic root/SSH execution."
  - "Retire/unmount the old rollback source disk when convenient now that migration closure is accepted."
  - "Replace the temporary migration-version override with a permanent container image pin/update policy."
  - "Continue secrets hardening, backup/restore maturity and infrastructure monitoring as post-migration operations."

portfolio:
  milestone: true
  signal: >
    Formally closed the staged notebook-to-desktop Ubuntu Server migration and
    moved the project into post-migration operations. The platform now hosts a
    source-agnostic local movie-intelligence data layer with verified ČSFD
    ingestion and a persistent twice-monthly systemd sync. This creates a
    practical, auditable foundation for future AI tools and narrow media-control
    actions such as querying state and safely requesting Radarr downloads.

verification:
